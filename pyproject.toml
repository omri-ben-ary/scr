[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium"
version = "0.1.0"
description = "Git-backed research task queues with a hashed dependency graph"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
scr = "scr.cli:main"

[tool.setuptools]
packages = ["scr"]

[dependency-groups]
dev = ["pytest>=8"]
