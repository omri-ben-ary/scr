[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium"
version = "0.1.0"
description = "Git-backed research task queues with a hashed dependency graph"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.scripts]
scr = "scr.cli:main"

[tool.setuptools]
packages = ["scr"]

[tool.setuptools.package-data]
# the code's own files (scr/assets.py) and the shipped default config travel in the wheel
scr = ["assets/**/*", "defaults/config/*.yaml"]

[dependency-groups]
dev = ["pytest>=8"]
