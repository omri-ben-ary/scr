[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium"
dynamic = ["version"]   # from the release tag (setuptools-scm; scr release)
description = "Git-backed research task queues with a hashed dependency graph"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.scripts]
scr = "scr.cli:main"

[tool.setuptools]
packages = ["scr"]

[tool.setuptools.package-data]
# the code's own files (scr/assets.py) and the shipped default config travel in the wheel
scr = ["assets/**/*", "defaults/config/*.yaml"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = [
    "windows: Windows-specific behaviour (junctions, taskkill, powershell, CRLF, cmd /c); also run by the tests (windows) CI job",
]

[tool.setuptools_scm]
fallback_version = "0.1.0"   # a checkout or archive with no tags in reach
