name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: git identity for the test worlds
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - run: uv run python -m pytest tests -q -p no:cacheprovider
      - name: wheel installs non-editable and finds its own files
        run: uv run python tools/check_wheel.py
