name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: git identity for the test worlds
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - run: uv run python -m pytest tests -q -p no:cacheprovider
      - name: wheel installs non-editable and finds its own files
        run: uv run python tools/check_wheel.py

  windows:
    name: tests (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: git identity for the test worlds
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - name: Windows-specific tests (junctions, taskkill, powershell, CRLF, cmd /c)
        run: uv run python -m pytest tests -q -p no:cacheprovider -m windows
      - name: smoke on a cp1255 console with no utf-8 overrides
        shell: cmd
        env:
          SCR_NO_JOURNAL: "1"
          PYTHONUTF8: "0"
        run: |
          chcp 1255
          set ROOT=%RUNNER_TEMP%\state
          uv run scr --root "%ROOT%" init || exit /b 1
          uv run scr --root "%ROOT%" task new "Smoke: arrows → and dashes —" --id T-0001 --origin omri || exit /b 1
          uv run scr --root "%ROOT%" verify || exit /b 1
      - name: both PowerShell scripts parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in "tools\rehearse.ps1", "tools\cutover.ps1") {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$f : $_" }; exit 1 }
            # 5.1 reads a BOM-less .ps1 as ANSI: a non-ASCII byte can end a string early
            if ([IO.File]::ReadAllBytes((Resolve-Path $f)) | Where-Object { $_ -gt 127 } | Select-Object -First 1) { Write-Host "$f has non-ASCII bytes"; exit 1 }
            Write-Host "$f parses"
          }
      - name: rehearse.ps1 end to end against a synthetic state (a locally built wheel, Windows PowerShell 5.1)
        shell: powershell
        env:
          SCR_NO_NOTIFY: "1"
        run: |
          $ErrorActionPreference = "Stop"
          uv build --wheel --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          $state = Join-Path $env:RUNNER_TEMP "desk\scriptorium"
          New-Item -ItemType Directory -Path $state -Force | Out-Null
          uv run scr --root $state init --quiet
          # scr init leaves config/ empty; a real state has Omri's config, so seed the shipped defaults
          Copy-Item scr\defaults\config\*.yaml (Join-Path $state "config") -Force
          # Windows PowerShell 5.1 reads this step as ANSI: build the non-ASCII title from code points
          $title = "Rehearsal smoke: arrows " + [char]0x2192 + " and dashes " + [char]0x2014
          uv run scr --root $state --quiet task new $title --id T-0001 --origin omri
          git -C $state init -q -b main; git -C $state add -A; git -C $state commit -q -m seed
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\rehearse.ps1 -Tag v0.0.0 -State $state `
            -Runtime (Join-Path $env:RUNNER_TEMP "desk\scr-runtime") -Wheel $wheel -Python (Resolve-Path .venv\Scripts\python.exe).Path
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path (Join-Path $env:RUNNER_TEMP "desk\scr-runtime\current")) { Write-Host "rehearse.ps1 must not create current"; exit 1 }
          if (git -C $state status --porcelain) { Write-Host "rehearse.ps1 wrote to the live state"; git -C $state status; exit 1 }
      - name: wheel installs non-editable and finds its own files
        run: uv run python tools/check_wheel.py
